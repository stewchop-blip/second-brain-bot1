services:
  - type: web
    name: second-brain-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: second-brain-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MODEL
        value: gpt-4o-mini
      - key: MAX_TOKENS
        value: "1500"
      - key: TEMPERATURE
        value: "0.7"
      - key: REQUEST_TIMEOUT
        value: "30"
      - key: MAX_RETRIES
        value: "3"
      - key: DAILY_LIMIT
        value: "20"
      - key: MAX_MESSAGE_LENGTH
        value: "4000"
      - key: HISTORY_LIMIT
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_PATH
        value: /webhook

databases:
  - name: second-brain-db
    databaseName: second_brain
    user: second_brain_user
    plan: free
    region: frankfurt